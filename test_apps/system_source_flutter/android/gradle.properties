org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter's Gradle plugin doesn't support AGP 9's new DSL or built-in Kotlin
# yet (AGP's built-in Kotlin is older than Flutter's minimum), so keep the
# Flutter template's opt-outs and apply Kotlin's own Gradle plugin.
android.newDsl=false
android.builtInKotlin=false
